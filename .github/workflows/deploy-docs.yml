name: Publish MDAS documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mdas-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - name: Check interactive controller
        run: node --test site/tests/interactive.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # build.py installs only site/requirements.txt in an isolated uv tool environment.
      # It never installs the root project or executes research notebook cells.
      - name: Install documentation tools, build and check website
        run: python site/build.py
      - name: Upload website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/_build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
